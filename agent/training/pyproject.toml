[project]
name = "env"
version = "0.1.0"
description = "Gymnasium environment for DiabloDoom (-rlenv); see SPEC.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0",
]

[project.optional-dependencies]
# train.py. On the RTX 5080 (Blackwell) install the CUDA 12.8 build:
#   uv pip install --python .venv/bin/python torch --index-url https://download.pytorch.org/whl/cu128
train = ["torch>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["env"]
