name: Training tests

# The RL training code under agent/training (env package, model.py,
# eval.py, learn.py, train.py). Runs only the tests that need no game:
# tests marked `game` launch DiabloDoom with an IWAD, and IWADs are not in
# the repository. Run the full suite locally with agent/training/test.sh.

on:
  push:
    branches:
      - "master"
    paths:
      - "agent/training/**"
      - ".github/workflows/training-tests.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "agent/training/**"
      - ".github/workflows/training-tests.yml"
  workflow_dispatch:

concurrency:
  group: training-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (no game)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/training

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/training/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU build: the runner has no GPU, and it is far smaller.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -m "not game" -v
